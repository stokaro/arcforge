name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Release target manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-tools
      - name: Generate native matrix
        id: targets
        run: |
          matrix="$(cargo xtask ci-matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  native:
    name: Native ${{ matrix.target }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TARGET: ${{ matrix.target }}
      RUSTUP_TOOLCHAIN: 1.100.1-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Install Linux native capture display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xauth libgl1-mesa-dri libxkbcommon-x11-0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --target "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Format, layers, Clippy, tests and build
        run: cargo xtask check --target "$TARGET"
      - name: Package unsigned development bundle
        run: cargo xtask package --target "$TARGET"
      - name: Verify and run the unpacked development bundle
        run: cargo xtask verify-package --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcforge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Capture real native GUI scenes on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ARCFORGE_CAPTURE_DISPLAY: "Xvfb X11; Mesa software OpenGL requested"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" cargo xtask gui-capture --target "$TARGET" --directory "$RUNNER_TEMP/arcforge-native-gui-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$TARGET"
      - name: Prepare pinned Windows software OpenGL for native capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare_windows_capture_driver.ps1 -Target $env:TARGET
      - name: Capture real native GUI scenes on Windows and macOS
        if: runner.os != 'Linux'
        env:
          ARCFORGE_CAPTURE_DISPLAY: "GitHub-hosted native desktop session"
        run: cargo xtask gui-capture --target "$TARGET" --directory "$RUNNER_TEMP/arcforge-native-gui-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$TARGET"
      - name: Upload native GUI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-gui-${{ matrix.target }}
          path: ${{ runner.temp }}/arcforge-native-gui-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.target }}/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Remove CI-only Windows OpenGL library before caching
        if: always() && runner.os == 'Windows' && env.ARCFORGE_CAPTURE_GL_LIBRARY_PATH != ''
        shell: pwsh
        run: ./scripts/prepare_windows_capture_driver.ps1 -Cleanup
  macos-current-capture:
    name: Native GUI macOS 26 ARM64
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: aarch64-apple-darwin
      RUSTUP_TOOLCHAIN: 1.100.1-aarch64-apple-darwin
      ARCFORGE_CAPTURE_DISPLAY: "GitHub-hosted macOS 26 native desktop session"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-gui-macos-26
      - name: Capture real native GUI scenes
        run: cargo xtask gui-capture --target "$TARGET" --directory "$RUNNER_TEMP/arcforge-native-gui-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/macos-26-$TARGET"
      - name: Upload macOS 26 native GUI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-gui-macos-26-aarch64-apple-darwin
          path: ${{ runner.temp }}/arcforge-native-gui-${{ github.run_id }}-${{ github.run_attempt }}/macos-26-aarch64-apple-darwin/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
  bundles:
    name: Complete release bundle set
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: arcforge-*
          path: dist
          merge-multiple: true
      - name: Verify all targets, checksums, source revisions and native evidence
        run: cargo xtask verify-release --directory dist --commit "$(git rev-parse HEAD)"
