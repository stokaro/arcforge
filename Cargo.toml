[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["apps/arcforge", "apps/arcforge-cli"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100.1"
license = "MIT"
repository = "https://github.com/stokaro/arcforge"

[workspace.dependencies]
arcforge-core = { path = "crates/core" }
arcforge-ui-egui = { path = "crates/ui-egui" }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=9.8.2", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
sha2 = "0.10"
same-file = "1.0.6"
encoding_rs = "=0.8.44"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
caseless = "=0.2.2"
unicode-normalization = "=0.1.26"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
